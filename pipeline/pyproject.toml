[project]
name = "dotagraph-pipeline"
version = "0.1.0"
description = "Offline data and layout generation for DotaGraph"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dotagraph_pipeline"]
