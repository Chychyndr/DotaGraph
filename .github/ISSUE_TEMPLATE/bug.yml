name: Bug
description: Report broken behavior in DotaGraph
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the hero/state and what you expected.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL / hero state
      placeholder: "?hero=viper&matchup=shadow-demon"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser / device
