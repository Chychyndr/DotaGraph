name: Feature request
description: Propose a product, UX, methodology, or contributor improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user/contributor problem exists today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs / alternatives
      description: Especially note any extra graph clutter or data-source implications.
