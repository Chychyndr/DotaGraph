name: Generate 7.41e layout

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dotagraph-generate-741e-layout
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run pipeline unit tests
        run: uv run --project pipeline python -m unittest discover -s pipeline/tests -v

      - name: Generate patch 7.41e layout
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: uv run --project pipeline python -m dotagraph_pipeline.generate_patch_layout --output src/data/layout-7.41e.json

      - name: Commit generated snapshot
        run: |
          if git ls-files --error-unmatch src/data/layout-7.41e.json >/dev/null 2>&1 \
            && git diff --quiet -- src/data/layout-7.41e.json; then
            echo "Layout snapshot is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/layout-7.41e.json
          git commit -m "data: generate real 7.41e graph layout"
          BRANCH="${GITHUB_REF_NAME}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
