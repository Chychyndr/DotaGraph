name: STRATZ Immortal preview

on:
  workflow_dispatch:
    inputs:
      match_ids:
        description: "Up to 20 public match IDs separated by spaces"
        required: true
        default: "9085800147 9085798479 9085791811"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/stratz-immortal-preview.yml
      - pipeline/dotagraph_pipeline/stratz_preview.py
      - pipeline/dotagraph_pipeline/generate_current_bundle.py
      - .github/workflows/update-current-data.yml
      - tests/e2e/data.spec.ts

permissions:
  contents: read

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'feat/stratz-immortal-preview')
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch and process a bounded match sample
        if: github.event_name == 'workflow_dispatch'
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
          STRATZ_MATCH_IDS: ${{ inputs.match_ids || '9085800147 9085798479 9085791811' }}
          PYTHONPATH: pipeline
        run: |
          read -r -a match_ids <<< "$STRATZ_MATCH_IDS"
          python3 -m dotagraph_pipeline.stratz_preview "${match_ids[@]}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Enrich the production bundle with live STRATZ evidence
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: |
          uv run --locked --project pipeline python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          from dotagraph_pipeline.generate_current_bundle import (
              _load_catalog, _load_opendota_hero_map, add_stratz_evidence,
          )
          from dotagraph_pipeline.logging_utils import configure_logging

          path = Path("public/data/current-matchups.json")
          data = json.loads(path.read_text())
          end = datetime.fromisoformat(data["scope"]["observationWindowEndExclusive"])
          hero_map = _load_opendota_hero_map(Path.cwd(), _load_catalog(Path.cwd()))
          count = add_stratz_evidence(
              data, hero_map, end_epoch=int(end.timestamp()),
              collected_at=datetime.now(timezone.utc).isoformat(),
              token=os.environ["STRATZ_API_TOKEN"].strip(),
              logger=configure_logging(),
          )
          print(f"STRATZ observations in generated bundle: {count}")
          if count == 0:
              raise SystemExit("No live STRATZ evidence reached the generated bundle.")
          path.write_text(json.dumps(data), encoding="utf-8")
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install chromium
      - name: Verify the real evidence in a matchup card
        run: npm run test:e2e -- tests/e2e/data.spec.ts
