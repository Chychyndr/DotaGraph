name: Collect verified Immortal evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotagraph-immortal-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Collect verified Immortal intervals through official bulk API
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p artifacts/immortal
          uv run --locked --project pipeline python scripts/collect_immortal.py \
            2>&1 | tee artifacts/immortal/collection.log
      - name: Upload aggregate evidence and collection log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: immortal-verified-aggregates
          path: artifacts/immortal/
          retention-days: 7
