name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Generate Python lockfile
        run: uv lock --project pipeline

      - name: Run data pipeline unit tests
        run: uv run --locked --project pipeline python -m unittest discover -s pipeline/tests -v

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate JavaScript lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v7
        with:
          name: generated-lockfiles
          path: |
            package-lock.json
            pipeline/uv.lock
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated lockfiles to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"

          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock npm dependencies"
          fi

          git add pipeline/uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: lock uv dependencies"
          fi

          git push origin "HEAD:$HEAD_BRANCH"

      - run: npm ci

      - name: Audit npm dependencies
        shell: bash
        run: |
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/npm-audit.json || true
          node scripts/report-npm-audit.mjs \
            artifacts/security/npm-audit.json \
            --fail-on=high \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: artifacts/security/npm-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Cache generated hero atlas
        uses: actions/cache@v6
        with:
          path: |
            public/assets/heroes-atlas.webp
            public/assets/heroes-atlas.manifest.json
          key: hero-atlas-${{ hashFiles('src/data/heroCatalog.json', 'scripts/generate-hero-atlas.mjs') }}

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Impeccable design detector
        run: npm run design:detect

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Verify GitHub Pages production artifact
        env:
          DOTAGRAPH_PAGES: "1"
          VITE_BUILD_SHA: ci-pages-build
          EXPECTED_BUILD_SHA: ci-pages-build
        run: |
          rm -rf dist
          npm run build
          npm run verify:pages

      - name: Upload UX screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotagraph-ux-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
