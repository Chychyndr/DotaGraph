name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Run data pipeline unit tests
        run: uv run --project pipeline python -m unittest discover -s pipeline/tests -v

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm install

      - name: Audit npm dependencies
        shell: bash
        run: |
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/npm-audit.json || true
          node scripts/report-npm-audit.mjs \
            artifacts/security/npm-audit.json \
            --fail-on=high \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: artifacts/security/npm-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Cache generated hero atlas
        uses: actions/cache@v6
        with:
          path: |
            public/assets/heroes-atlas.webp
            public/assets/heroes-atlas.manifest.json
          key: hero-atlas-${{ hashFiles('src/data/heroCatalog.json', 'scripts/generate-hero-atlas.mjs') }}

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Impeccable design detector
        run: npm run design:detect

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Verify GitHub Pages production artifact
        env:
          DOTAGRAPH_PAGES: "1"
          VITE_BUILD_SHA: ci-pages-build
          EXPECTED_BUILD_SHA: ci-pages-build
        run: |
          rm -rf dist
          npm run build
          npm run verify:pages

      - name: Upload UX screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotagraph-ux-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
