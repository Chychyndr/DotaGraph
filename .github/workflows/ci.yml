name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run data pipeline unit tests
        run: uv run --project pipeline python -m unittest discover -s pipeline/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - name: Cache generated hero atlas
        uses: actions/cache@v4
        with:
          path: |
            public/assets/heroes-atlas.webp
            public/assets/heroes-atlas.manifest.json
          key: hero-atlas-${{ hashFiles('src/data/heroCatalog.json', 'scripts/generate-hero-atlas.mjs') }}

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Impeccable design detector
        run: npm run design:detect

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Verify GitHub Pages production artifact
        env:
          DOTAGRAPH_PAGES: "1"
          VITE_BUILD_SHA: ci-pages-build
          EXPECTED_BUILD_SHA: ci-pages-build
        run: |
          rm -rf dist
          npm run build
          npm run verify:pages

      - name: Upload UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotagraph-ux-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
