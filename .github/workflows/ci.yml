name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Impeccable design detector
        continue-on-error: true
        run: npm run design:detect
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotagraph-ux-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
