name: Update current matchup data

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pipeline/**
      - src/data/productionSnapshot.ts
      - src/data/dataset.ts
      - src/data/heroCatalog.json
      - src/domain/types.ts
      - .github/workflows/update-current-data.yml

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: dotagraph-current-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Record source main revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run pipeline tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/pipeline
          uv run --locked --project pipeline \
            python -m unittest discover -s pipeline/tests -v \
            2>&1 | tee artifacts/pipeline/pipeline-tests.log

      - name: Generate current matchup bundle
        shell: bash
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p artifacts/pipeline
          uv run --locked --project pipeline \
            python -m dotagraph_pipeline.generate_current_bundle \
            --output public/data/current-matchups.json \
            --verbose \
            2>&1 | tee artifacts/pipeline/current-data.log

      - name: Summarize generated data
        shell: bash
        run: |
          uv run --locked --project pipeline python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("public/data/current-matchups.json").read_text())
          coverage = data["coverage"]
          metrics = data["layoutMetrics"]

          print("## DotaGraph current data")
          print()
          print(f"- Patch: **{data['patch']}**")
          print(f"- Generated: **{data['generatedAt']}**")
          print(f"- Heroes: **{coverage['mappedHeroCount']}/{coverage['catalogHeroCount']}**")
          print(f"- Relationships: **{coverage['rankedRelationshipCount']}**")
          print(f"- Qualifying pairs: **{coverage['qualifyingPairCount']}**")
          print(f"- Layout relationships: **{coverage['layoutRelationshipCount']}**")
          print(f"- Layout median distance: **{metrics['medianDistance']} px**")
          print(f"- Layout p95 distance: **{metrics['p95Distance']} px**")
          print(f"- Minimum node distance: **{metrics['minimumNodeDistance']} px**")
          print(f"- Worst nearest-node gap: **{metrics['maxNearestNodeDistance']} px**")
          print(f"- Isolated heroes: **{metrics['isolatedNodeCount']}**")
          PY

      - name: Upload pipeline debug log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-data-debug-${{ github.run_id }}
          path: artifacts/pipeline/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish generated data branch and pull request
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-files --error-unmatch public/data/current-matchups.json >/dev/null 2>&1 \
            && git diff --quiet -- public/data/current-matchups.json; then
            echo "Current matchup bundle is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PATCH="$(uv run --locked --project pipeline python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("public/data/current-matchups.json").read_text())["patch"])
          PY
          )"
          REFRESH_BRANCH="automation/current-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$REFRESH_BRANCH"
          git add public/data/current-matchups.json
          git commit -m "data: refresh current ${PATCH} matchups"
          git push origin "HEAD:$REFRESH_BRANCH"

          PR_URL="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$REFRESH_BRANCH" \
            --title "data: refresh current ${PATCH} matchups" \
            --body "Automated current-patch data refresh from workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The generated branch is validated by CI before this pull request is merged.")"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$REFRESH_BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Validate generated data branch with CI
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$REFRESH_BRANCH"

          RUN_ID=""
          for attempt in {1..30}; do
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch "$REFRESH_BRANCH" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$RUN_ID" ]; then
            echo "Unable to find the dispatched CI run for $REFRESH_BRANCH." >&2
            exit 1
          fi

          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Merge validated data pull request
        id: merge
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: |
          gh pr merge "$PR_URL" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --delete-branch

          MERGE_SHA=""
          for attempt in {1..30}; do
            MERGE_SHA="$(gh pr view "$PR_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --json mergeCommit \
              --jq '.mergeCommit.oid // empty')"
            if [ -n "$MERGE_SHA" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$MERGE_SHA" ]; then
            echo "Unable to resolve the merged data revision." >&2
            exit 1
          fi

          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment target
        id: target
        if: steps.publish.outputs.changed == 'true' || github.event_name == 'push'
        shell: bash
        env:
          CHANGED: ${{ steps.publish.outputs.changed }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            TARGET_SHA="$MERGE_SHA"
          else
            TARGET_SHA="$SOURCE_SHA"
          fi

          if [ -z "$TARGET_SHA" ]; then
            echo "Unable to resolve deployment target." >&2
            exit 1
          fi

          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Deployment target: `$TARGET_SHA`" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure deployment target is current main
        if: steps.target.outputs.sha != ''
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$REMOTE_MAIN" != "$TARGET_SHA" ]; then
            echo "main moved from deployment target $TARGET_SHA to $REMOTE_MAIN; refusing to deploy a stale revision." >&2
            exit 1
          fi

      - name: Validate merged main revision with CI
        if: steps.target.outputs.sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

          RUN_ID=""
          for attempt in {1..30}; do
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" \
              | head -n 1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$RUN_ID" ]; then
            echo "Unable to find dispatched main CI for $TARGET_SHA." >&2
            exit 1
          fi

          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Deploy validated main revision to Pages
        if: steps.target.outputs.sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh workflow run pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_sha="$TARGET_SHA"

          RUN_ID=""
          EXPECTED_TITLE="Deploy GitHub Pages $TARGET_SHA"
          for attempt in {1..30}; do
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow pages.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"$EXPECTED_TITLE\") | .databaseId" \
              | head -n 1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$RUN_ID" ]; then
            echo "Unable to find exact-SHA Pages deployment for $TARGET_SHA." >&2
            exit 1
          fi

          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

          {
            echo
            echo "## Deployment synchronization"
            echo
            echo "- Main CI: passed for `$TARGET_SHA`"
            echo "- Pages + live Chromium verification: passed for `$TARGET_SHA`"
          } >> "$GITHUB_STEP_SUMMARY"
