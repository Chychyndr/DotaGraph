name: Deploy GitHub Pages
run-name: >-
  Deploy GitHub Pages ${{ github.event.inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact tested commit SHA to deploy
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}

jobs:
  deployment-guard:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.guard.outputs.deploy }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Guard data-sensitive revisions
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Explicit deployment requested for $TARGET_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git rev-parse "${TARGET_SHA}^1" >/dev/null 2>&1; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "No parent revision is available; allowing deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mapfile -t changed_paths < <(
            git diff --name-only "${TARGET_SHA}^1" "$TARGET_SHA"
          )

          data_sensitive=false
          for path in "${changed_paths[@]}"; do
            case "$path" in
              pipeline/*|src/data/productionSnapshot.ts|src/data/dataset.ts|src/data/heroCatalog.json|src/domain/types.ts|.github/workflows/update-current-data.yml)
                data_sensitive=true
                ;;
            esac
          done

          if [ "$data_sensitive" = true ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Pages deployment deferred"
              echo
              echo "Commit `$TARGET_SHA` changes data-sensitive code."
              echo "The current-data workflow must regenerate/validate the production bundle and explicitly deploy the resulting exact SHA."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

  build:
    needs: deployment-guard
    if: needs.deployment-guard.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm install
      - name: Cache generated hero atlas
        uses: actions/cache@v6
        with:
          path: |
            public/assets/heroes-atlas.webp
            public/assets/heroes-atlas.manifest.json
          key: hero-atlas-${{ hashFiles('src/data/heroCatalog.json', 'scripts/generate-hero-atlas.mjs') }}

      - run: npm run typecheck
      - run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          DOTAGRAPH_PAGES: "1"
          VITE_BUILD_SHA: ${{ env.TARGET_SHA }}

      - name: Verify Pages artifact
        run: npm run verify:pages
        env:
          EXPECTED_BUILD_SHA: ${{ env.TARGET_SHA }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Verify deployed site in Chromium
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_BUILD_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/verify-live-browser.mjs

      - name: Upload live verification screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotagraph-live-verification
          path: artifacts/live-site
          if-no-files-found: ignore
