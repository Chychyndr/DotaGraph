name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pages publishing source
        shell: bash
        run: |
          set -euo pipefail
          pages_json="$(curl --fail --silent --show-error             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(printf '%s' "$pages_json" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const pages = JSON.parse(input);
              process.stdout.write(pages.build_type ?? "legacy");
            });
          ')"
          echo "GitHub Pages build type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=GitHub Pages is using the wrong publishing source::Settings > Pages > Build and deployment > Source must be GitHub Actions. The current legacy branch/Jekyll deployment publishes the unbuilt Vite source and overwrites the compiled site."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run typecheck
      - run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          DOTAGRAPH_PAGES: "1"

      - name: Verify Pages artifact
        run: npm run verify:pages

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify the public site serves the compiled app
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          html="$(curl --fail --silent --show-error --location             --retry 6 --retry-delay 5 --retry-all-errors "$SITE_URL")"

          if printf '%s' "$html" | grep -q '/src/main.tsx'; then
            echo "::error::The live site is serving repository source instead of the compiled Vite app."
            exit 1
          fi

          if printf '%s' "$html" | grep -q '%BASE_URL%'; then
            echo "::error::The live site contains an unresolved Vite BASE_URL placeholder."
            exit 1
          fi

          asset_path="$(printf '%s' "$html" | grep -oE '/DotaGraph/assets/index-[^"]+\.js' | head -n 1)"
          if [ -z "$asset_path" ]; then
            echo "::error::The live page does not reference a compiled DotaGraph JavaScript bundle."
            exit 1
          fi

          origin="$(node -e 'const u = new URL(process.argv[1]); process.stdout.write(u.origin)' "$SITE_URL")"
          curl --fail --silent --show-error --head --location             --retry 6 --retry-delay 5 --retry-all-errors             "$origin$asset_path" >/dev/null

          echo "Live GitHub Pages smoke test passed: $SITE_URL"
