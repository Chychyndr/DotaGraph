name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run typecheck
      - run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          DOTAGRAPH_PAGES: "1"
          VITE_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify Pages artifact
        run: npm run verify:pages
        env:
          EXPECTED_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Verify deployed site in Chromium
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/verify-live-browser.mjs

      - name: Upload live verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotagraph-live-verification
          path: artifacts/live-site
          if-no-files-found: ignore
